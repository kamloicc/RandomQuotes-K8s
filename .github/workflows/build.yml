name: Build Container

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/**'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'src/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-and-push-application:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.14
        with:
          versionSpec: 5.x

      - name: Determine Version
        id: determine_version
        uses: gittools/actions/gitversion/execute@v0.9.14
        with:
          additionalArguments: /overrideconfig mode=Mainline

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: randomquotesacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push website container
        working-directory: src
        run: |
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            -f "./RandomQuotes.Web/Dockerfile" \
            --tag randomquotesacr.azurecr.io/randomquotes:${{ env.GitVersion_SemVer }} \
            --tag randomquotesacr.azurecr.io/randomquotes:latest \
            .
         